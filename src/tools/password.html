<!doctype html>
<html>

<head>
	<meta charset="UTF-8" />
	<link rel="stylesheet" href="tool.css" />
</head>

<body>
	<div id="titlebar"><strong>Password Analyzer</strong><button onclick="window.api.close()">✕</button></div>
	<select id="mode">
		<option value="analyze">Analyze</option>
		<option value="generate">Generate</option>
	</select>
	<input id="input" type="password" placeholder="Enter password to analyze..." />
	<div id="output">— output —</div>
	<script>
		const modeSelect = document.getElementById('mode');
		const input = document.getElementById('input');
		modeSelect.addEventListener('change', () => {
			input.style.display = modeSelect.value === 'generate' ? 'none' : '';
		});
		async function run() {
			document.getElementById('output').textContent = 'Checking...';
			document.getElementById('output').textContent = await window.api.run('password', modeSelect.value, input.value);
		}
		input.addEventListener('keydown', e => { if (e.key === 'Enter') run(); });
		document.addEventListener('keydown', e => {
			if (e.key === 'Escape') window.api.close();
			if (e.key === 'Enter' && modeSelect.value === 'generate') run();
		});
		input.focus();
	</script>
</body>

</html>
