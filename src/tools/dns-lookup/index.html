<!doctype html>
<html>

<head>
	<meta charset="UTF-8" />
	<link rel="stylesheet" href="../tool.css" />
</head>

<body>
	<div id="titlebar"><strong>DNS Lookup</strong><button onclick="window.api.close()">✕</button></div>
	<select id="type">
		<option value="A">A — IPv4</option>
		<option value="AAAA">AAAA — IPv6</option>
		<option value="MX">MX — Mail</option>
		<option value="NS">NS — Nameservers</option>
		<option value="TXT">TXT — Text records</option>
		<option value="CNAME">CNAME</option>
	</select>
	<input id="input" type="text" placeholder="example.com" />
	<div id="output">— output —</div>
	<script>
		async function run() {
			const input = document.getElementById('input').value.trim();
			if (!input) return;
			document.getElementById('output').textContent = 'Looking up...';
			document.getElementById('output').textContent = await window.api.run('dns-lookup', document.getElementById('type').value, input);
		}
		document.getElementById('input').addEventListener('keydown', e => { if (e.key === 'Enter') run(); });
		document.addEventListener('keydown', e => { if (e.key === 'Escape') window.api.close(); });
		document.getElementById('input').focus();
	</script>
</body>

</html>
