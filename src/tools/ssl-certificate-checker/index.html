<!doctype html>
<html>
<head><meta charset="UTF-8" /><link rel="stylesheet" href="../tool.css" /></head>
<body>
	<div id="titlebar"><strong>SSL Certificate Checker</strong><button onclick="window.api.close()">✕</button></div>
	<input id="input" type="text" placeholder="example.com or https://example.com" />
	<div id="output">— output —</div>
	<script>
		async function run() {
			const input = document.getElementById('input').value.trim();
			if (!input) return;
			document.getElementById('output').textContent = 'Connecting...';
			document.getElementById('output').textContent = await window.api.run('ssl-certificate-checker', null, input);
		}
		document.getElementById('input').addEventListener('keydown', e => { if (e.key === 'Enter') run(); });
		document.addEventListener('keydown', e => { if (e.key === 'Escape') window.api.close(); });
		document.getElementById('input').focus();
	</script>
</body>
</html>
