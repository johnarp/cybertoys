<!doctype html>
<html>

<head>
	<meta charset="UTF-8" />
	<title>CyberToys</title>
	<link rel="stylesheet" href="index.css" />
</head>

<body>

	<div id="sidebar">
		<div id="app-name">CyberToys</div>
		<nav id="nav">
			<div class="nav-item" id="home-item">Home</div>
		</nav>
	</div>

	<div id="right-panel">
		<div id="drag-strip"></div>
		<div id="content"></div>
	</div>

	<script>
		const tools = window.api.tools;

		function setActive(el) {
			document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
			el.classList.add('active');
		}

		function showHome() {
			document.getElementById('content').innerHTML = `
				<h1>Home</h1>
				<p>Select a tool from the sidebar, or press its hotkey anywhere to open it as a quick popup.</p>
			`;
		}

		const homeItem = document.getElementById('home-item');
		showHome();
		setActive(homeItem);
		homeItem.addEventListener('click', () => { showHome(); setActive(homeItem); });

		const categories = {};
		for (const tool of tools) {
			if (!categories[tool.category]) categories[tool.category] = [];
			categories[tool.category].push(tool);
		}

		const nav = document.getElementById('nav');
		for (const [category, categoryTools] of Object.entries(categories)) {
			const section = document.createElement('div');
			section.className = 'nav-section';

			const heading = document.createElement('div');
			heading.className = 'nav-heading';
			heading.textContent = category;
			heading.addEventListener('click', () => section.classList.toggle('collapsed'));
			section.appendChild(heading);

			for (const tool of categoryTools) {
				const item = document.createElement('div');
				item.className = 'nav-item';
				item.textContent = tool.name;
				item.addEventListener('click', () => { showTool(tool); setActive(item); });
				section.appendChild(item);
			}

			nav.appendChild(section);
		}

		function showTool(tool) {
			const hotkey = tool.hotkey.replace('CommandOrControl', 'Ctrl/⌘');
			document.getElementById('content').innerHTML = `
				<h1>${tool.name}</h1>
				<p>${tool.description}</p>
				<p><strong>Hotkey:</strong> <code>${hotkey}</code></p>
				<button onclick="window.api.openTool('${tool.id}')">Open popup</button>
			`;
		}
	</script>

</body>

</html>
